name: build-and-deploy

on:
  push:
    branches:
      - main

concurrency:
  group: asteroid-game-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: asteroid_ci
          POSTGRES_PASSWORD: asteroid_ci
          POSTGRES_DB: asteroid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asteroid_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Lint
        run: pnpm exec biome check --diagnostic-level=error .

      - name: Runtime and match handoff tests
        env:
          TEST_DATABASE_URL: postgres://asteroid_ci:asteroid_ci@127.0.0.1:5432/asteroid_ci
        run: pnpm run test:runtime-security && pnpm run test:server

      - name: Client tests
        run: pnpm run test:client

  # The web client is a static Vite build served by the Cloudflare Worker
  # asteroid-game-client on the route asteroids.trebeljahr.com/*. /trpc/*,
  # /socket.io/* and /.well-known/acme-challenge/* have routes with no Worker
  # and reach the server app on Coolify. This job uploads a Worker version
  # and activates nothing; deploy-client switches to it once the server
  # reports this commit.
  build-client:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    env:
      SITE_URL: https://asteroids.trebeljahr.com
      WRANGLER: wrangler@4.145.0
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @simple-asteroid-game/client...

      # VITE_SENTRY_DSN is a repository VARIABLE, not a secret: the DSN ships
      # in the bundle either way. Empty means the build reports nowhere
      # (client/src/errorReporting).
      - name: Build the static client
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "::notice::VITE_SENTRY_DSN is not set: this client build sends no error reports."
          fi
          pnpm run build:client
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > client/dist/version.json

      # A Worker version serves only its own files. Carry the last two
      # releases' hashed files so tabs opened before this deploy keep
      # loading theirs.
      - name: Carry earlier releases' hashed files
        run: node scripts/carry-static.mjs --site "$SITE_URL" --out client/dist --dir _assets

      - name: Upload a new Worker version (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          set -euo pipefail
          pnpm dlx "$WRANGLER" versions upload --tag "$GITHUB_SHA" --message "$GITHUB_SHA"
          id=$(node -e 'const rows=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").map((l)=>JSON.parse(l));const row=rows.find((r)=>r.type==="version-upload");if(!row?.version_id)process.exit(1);console.log(row.version_id)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
          echo "Uploaded Worker version $id (not live yet)"

  build-server:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/asteroid-game-server
          tags: |
            type=raw,value=main
            type=sha,format=long

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-client, build-server]
    # Keep unset while the old Compose app owns production. Enable only after
    # both image apps are live and deploy secrets point at their resource UUIDs.
    if: vars.ASTEROID_IMAGE_ROLLOUT_READY == 'true'
    outputs:
      server_deployed: ${{ steps.server-deployed.outputs.deployed }}
    steps:
      # Point the server's `:live` at the image this run built. The Coolify
      # server app pulls `:live`, so this decides which build the deploy
      # below starts. It uses this job's own GITHUB_TOKEN (`packages:
      # write`); no Coolify credential is involved. A rollback is the same
      # step with an older sha. The client is no image any more; the Worker
      # serves it (see build-client).
      - name: Promote this commit's server image to :live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/asteroid-game-server"
          docker buildx imagetools create --tag "$image:live" "$image:sha-${{ github.sha }}"
          echo "promoted $image:sha-${{ github.sha }} to :live"

      # Tell Coolify to deploy. There is no Coolify API token here: each
      # app has its own webhook secret (hatchkit mints it), and a `push`
      # payload signed with it queues a deploy of that one app — it can
      # read nothing and touch no other app. The payload names
      # `.hatchkit/deploy-webhook`, the app's only watch path, so an ordinary
      # push that reaches Coolify through its GitHub App never deploys a
      # build that does not exist yet; only this step does.
      #
      # Which apps: COOLIFY_RESOURCE_UUID for a single-app project, or
      # COOLIFY_SERVER_RESOURCE_UUID for a split one. The client has no
      # Coolify app; the Worker serves it.
      - name: Deploy via signed Coolify webhook
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_SERVER_DEPLOY_SECRET: ${{ secrets.COOLIFY_SERVER_DEPLOY_SECRET }}
          COOLIFY_SERVER_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_SERVER_DEPLOY_REPOSITORY }}
          COOLIFY_SERVER_DEPLOY_BRANCH: ${{ secrets.COOLIFY_SERVER_DEPLOY_BRANCH }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -euo pipefail
          deployed=0
          deploy() { # label, secret-name prefix
            local uuid_var="${2}RESOURCE_UUID" secret_var="${2}DEPLOY_SECRET"
            local repo_var="${2}DEPLOY_REPOSITORY" branch_var="${2}DEPLOY_BRANCH"
            local uuid="${!uuid_var:-}" secret="${!secret_var:-}"
            local repo="${!repo_var:-}" branch="${!branch_var:-}"
            [ -n "$uuid" ] || return 0
            if [ -z "$secret" ] || [ -z "$repo" ] || [ -z "$branch" ]; then
              echo "::error::${2}DEPLOY_SECRET/_REPOSITORY/_BRANCH are not set — run \`hatchkit sync\` or \`hatchkit secrets isolate\`."
              exit 1
            fi
            local body sig answer
            body=$(jq -cn --arg ref "refs/heads/$branch" --arg sha "$GITHUB_SHA" --arg repo "$repo" \
              '{ref: $ref, after: $sha, repository: {full_name: $repo}, commits: [{id: $sha, added: [], removed: [], modified: [".hatchkit/deploy-webhook"]}]}')
            sig=$(printf '%s' "$body" | HOOK_SECRET="$secret" node -e \
              'process.stdout.write(require("node:crypto").createHmac("sha256", process.env.HOOK_SECRET).update(require("node:fs").readFileSync(0)).digest("hex"))')
            answer=$(curl -fsS -X POST "$COOLIFY_BASE_URL/webhooks/source/github/events/manual" \
              -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
              -H "X-Hub-Signature-256: sha256=$sig" --data-binary "$body")
            if printf '%s' "$answer" | jq -e --arg uuid "$uuid" \
              'type == "array" and any(.[]; .application_uuid == $uuid and .status == "success")' \
              >/dev/null 2>&1; then
              echo "deploy queued for the $1 app ($uuid)"
              deployed=$((deployed + 1))
            else
              # Other apps on the same repo answer "Invalid signature.";
              # they are left out so a public log names only this one.
              detail=$(printf '%s' "$answer" | jq -c '[.[]? | select(.message != "Invalid signature.") | {status, message}]' 2>/dev/null || printf '%s' "$answer" | head -c 200)
              echo "::error::Coolify did not queue a deploy of the $1 app: $detail"
              exit 1
            fi
          }
          deploy app COOLIFY_
          deploy server COOLIFY_SERVER_
          if [ "$deployed" -eq 0 ]; then
            echo "::error::COOLIFY_BASE_URL is set but no COOLIFY_*RESOURCE_UUID is — nothing was deployed."
            exit 1
          fi

      # deploy-client follows the same gate as the webhook step above. A
      # step's `if:` reads only its own `env:`, so the gate's variable is
      # set here again.
      - name: Record that the server was deployed
        id: server-deployed
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
        if: env.COOLIFY_BASE_URL != ''
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  # Server first, then the client: deploy-client waits until the server
  # reports this commit, switches the Worker in one step, and checks
  # /version.json.
  deploy-client:
    runs-on: ubuntu-latest
    needs: [build-client, deploy]
    if: needs.deploy.outputs.server_deployed == 'true'
    env:
      SITE_URL: https://asteroids.trebeljahr.com
      WRANGLER: wrangler@4.145.0
    steps:
      # A rolling deploy answers from the old and the new container for a
      # while, so wait for three answers in a row.
      - name: Wait for the server at this commit
        run: |
          set -uo pipefail
          streak=0
          for i in $(seq 1 60); do
            got=$(curl -fsSL --max-time 10 "$SITE_URL/trpc/health?cb=$i$RANDOM" 2>/dev/null | jq -r '.result.data.version // empty' 2>/dev/null || true)
            if [ "$got" = "$GITHUB_SHA" ]; then
              streak=$((streak + 1))
              if [ "$streak" -ge 3 ]; then echo "✓ server reports $GITHUB_SHA"; exit 0; fi
            else
              streak=0
            fi
            echo "  server: ${got:-<no version>} — waiting ($i/60)"
            sleep 10
          done
          echo "::error::the server never reported $GITHUB_SHA on /trpc/health; the client was not switched."
          exit 1

      - name: Switch the client to this commit's Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ needs.build-client.outputs.version_id }}
        run: npx --yes "$WRANGLER" versions deploy "$VERSION_ID@100%" --name asteroid-game-client --message "$GITHUB_SHA" --yes

      - name: Verify the client is live
        run: |
          set -uo pipefail
          for i in $(seq 1 24); do
            commit=$(curl -fsSL --max-time 10 "$SITE_URL/version.json?cb=$i$RANDOM" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "✓ $SITE_URL serves $GITHUB_SHA"; exit 0; fi
            echo "  web: ${commit:-<no response>} — waiting ($i/24)"
            sleep 5
          done
          echo "::error::$SITE_URL/version.json never reported $GITHUB_SHA"; exit 1

  # Always runs, so a half-finished release says which half is live.
  release-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [build-client, build-server, deploy, deploy-client]
    steps:
      - name: Which half is live
        env:
          SERVER: ${{ needs.deploy.result }}
          SERVER_DEPLOYED: ${{ needs.deploy.outputs.server_deployed }}
          CLIENT: ${{ needs.deploy-client.result }}
          VERSION_ID: ${{ needs.build-client.outputs.version_id }}
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$SERVER" = "skipped" ] || { [ "$SERVER" = "success" ] && [ "$SERVER_DEPLOYED" != "true" ]; }; then
            say "Deploys are gated off or a build failed: nothing went live. Worker version ${VERSION_ID:-<none>} was uploaded, not activated."
            exit 0
          fi
          if [ "$SERVER" != "success" ]; then
            say "::error::Server deploy did not finish ($SERVER). The client was NOT switched: the previous Worker version still serves."
            exit 1
          fi
          if [ "$CLIENT" = "success" ]; then
            say "Server and client are both live at $GITHUB_SHA."
            exit 0
          fi
          say "::error::Server $GITHUB_SHA is LIVE. The client is NOT ($CLIENT): the previous Worker version still serves."
          say "To switch by hand: npx wrangler versions deploy ${VERSION_ID:-<id>}@100% --name asteroid-game-client --yes"
          exit 1
